name: CosyVoice iOS SDK

on:
  push:
    paths:
      - "ios/**"
      - "tools/**"
      - "PUBLIC_RELEASE_IDENTITY.md"
      - ".mailmap"
      - ".github/workflows/cosyvoice-ios-sdk.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/cosyvoice-ios-sdk.yml"

jobs:
  swift-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test standalone iOS package sources
        run: swift test --package-path ios

  device-smoke-compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile clean public-API smoke host for simulator
        run: |
          xcodebuild \
            -project ios/validation/DeviceSmoke/CosyVoice3DeviceSmoke.xcodeproj \
            -scheme CosyVoice3DeviceSmoke \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/.work/DeviceSmokeCIDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

  production-clean-room-compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Audit Production clean-room public API boundary
        run: python ios/validation/audit_production_clean_room.py
      - name: Compile Production clean-room consumer for simulator
        run: |
          xcodebuild \
            -project ios/validation/ProductionCleanRoom/CosyVoice3ProductionCleanRoom.xcodeproj \
            -scheme CosyVoice3ProductionCleanRoom \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/.work/ProductionCleanRoomCIDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile release Python tools
        run: python -m compileall -q ios/tools ios/assets ios/validation
      - name: Parse release shell tools
        run: |
          bash -n ios/validation/finish_ios_dynamic_n1_private_rc.sh
          bash -n ios/validation/run_dynamic_candidate_closure.sh
          bash -n ios/validation/run_candidate_benchmark.sh
          bash -n ios/validation/run_production_clean_room.sh
          bash -n ios/validation/finalize_production_nonlicense.sh
          bash -n ios/validation/run_dynamic_production_nonlicense_closure.sh
          bash -n tools/create_public_snapshot.sh
      - name: Audit shipping iOS source isolation
        run: python ios/validation/audit_source_isolation.py
      - name: Check canonical release identity and source closure
        run: python ios/validation/check_release_identity.py
      - name: Audit public release identity
        run: python tools/check_public_identity.py
      - name: Check deterministic public release tree
        run: python ios/validation/record_release_tree_reproducibility.py --check-only
      - name: Validate committed JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path("ios/manifest.json"),
              Path("ios/validation/release_receipt.json"),
              Path("ios/validation/dynamic_release_receipt.json"),
              Path("ios/assets/reference_enrollment.json"),
              Path("ios/assets/cosyvoice3_fixed225.example.json"),
              Path("ios/validation/development_receipt.json"),
              Path("ios/validation/production_baseline.json"),
              Path("ios/validation/history/fixed225_release_receipt.json"),
              Path("ios/validation/dynamic_n1_release_entry_2026-10-04.json"),
              Path("ios/validation/evidence/dynamic_n1_listening_acceptance.json"),
              Path("HTP/validation/release_receipt.json"),
              Path("ios/PUBLIC_PROVENANCE.json"),
          ]:
              json.loads(path.read_text())
              print("[JSON-PASS]", path)
          PY
