name: Lint

on:
  pull_request:
  push:

jobs:
  quick-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CosyVoice
        uses: actions/checkout@v4
      - name: Checkout PR tip
        if: github.event_name == 'pull_request'
        run: git checkout ${{ github.event.pull_request.head.sha }}
      - name: Ensure no tabs
        run: |
          (! git grep -I -l $'\t' -- . ':(exclude)*.txt' ':(exclude)*.svg' ':(exclude)**Makefile' ':(exclude)**/contrib/**' ':(exclude)third_party' ':(exclude).gitattributes' ':(exclude).gitmodules' || (echo "The above files have tabs; please convert them to spaces"; false))
      - name: Ensure no trailing whitespace
        run: |
          (! git grep -I -n $' $' -- . ':(exclude)*.txt' ':(exclude)third_party' ':(exclude).gitattributes' ':(exclude).gitmodules' || (echo "The above files have trailing whitespace; please remove them"; false))

  flake8-py3:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - name: Fetch CosyVoice
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Checkout PR tip
        if: github.event_name == 'pull_request'
        run: git checkout ${{ github.event.pull_request.head.sha }}
      - name: Run flake8 on changed upstream Python files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eux
          pip install flake8==3.8.2 flake8-bugbear flake8-comprehensions flake8-executable flake8-pyi==20.5.0 mccabe pycodestyle==2.6.0 pyflakes==2.2.0
          flake8 --version
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE="$PR_BASE_SHA"; else BASE="$PUSH_BEFORE"; fi
          if ! git cat-file -e "$BASE^{commit}"; then echo "No comparable base commit; changed-file flake8 is not applicable."; exit 0; fi
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.py' | grep -v '^ios/' | grep -v '^third_party/' | grep -v '^runtime/python/grpc/cosyvoice_pb2.*py$' > /tmp/changed-python.txt || true
          cat /tmp/changed-python.txt
          if [ ! -s /tmp/changed-python.txt ]; then echo "No changed non-iOS Python files to lint."; exit 0; fi
          xargs flake8 --max-line-length 180 --ignore B006,B008,B905,C408,E402,E731,E741,W503,W504,F401,F403,F405,F722,F841 < /tmp/changed-python.txt
